name: deploy pages

# Publishes docs/ + functions/ to Cloudflare Pages, so a push is all it takes --
# no more remembering `npx wrangler pages deploy`.
#
# Reusable on purpose: sync.yml CALLS this workflow too, because the daily sync
# commits with the default GITHUB_TOKEN and GitHub deliberately does not let such a
# push trigger another workflow (anti-recursion). Without the explicit call, the
# data would update every morning and the deployed site would keep serving
# yesterday's copy until someone pushed by hand.
#
# Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN   token with  Account -> Cloudflare Pages -> Edit
#   CLOUDFLARE_ACCOUNT_ID  the id from the dashboard sidebar
# Create the token at https://dash.cloudflare.com/profile/api-tokens
# (the "Edit Cloudflare Workers" template does NOT include Pages, so use a custom
# token with Cloudflare Pages:Edit, and add Workers Scripts:Edit only if you also
# want `cd worker && wrangler deploy` scripted).
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

# one deploy at a time; a cancelled half-run helps nobody
concurrency:
  group: deploy-pages
  cancel-in-progress: false

permissions:
  contents: read

env:
  # override with a repository variable if the project is ever renamed
  PAGES_URL: ${{ vars.PAGES_URL || 'https://nil-audio.pages.dev' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # "Not logged in." from wrangler is what you get when the token is missing,
      # mistyped, or set as an Environment secret this job does not declare -- and
      # it says nothing about which. Name the culprit instead: it is the difference
      # between a 5-second fix and an afternoon.
      - name: Check the Cloudflare credentials are present
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$CF_TOKEN" ]   || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CF_ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Add them at Settings -> Secrets and variables -> Actions -> Repository secrets."
            echo "  CLOUDFLARE_API_TOKEN : custom token with Account -> Cloudflare Pages -> Edit"
            echo "                         (the 'Edit Cloudflare Workers' template does NOT include Pages)"
            echo "  CLOUDFLARE_ACCOUNT_ID: the id in the dashboard's right-hand sidebar"
            echo "If they already exist, check they are Repository secrets, not Environment"
            echo "secrets -- this job declares no environment, so it cannot read those."
            exit 1
          fi
          echo "both secrets are present"

      # Prints the account and the token's own permission list, so a token that is
      # valid but missing Pages:Edit is obvious before the deploy fails obscurely.
      - name: Show which account and token this will use
        run: npx --yes wrangler@4 whoami
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Reads ./wrangler.toml: name = nil-audio, pages_build_output_dir = docs,
      # and picks up functions/ from the repo root. No arguments needed.
      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # "The deploy step exited 0" is not the same as "the site now serves this
      # build" -- propagation is not instant, and a silent no-op deploy looks
      # exactly like a successful one. So wait for the served build stamp to agree
      # with the one in the repo, and fail loudly if it never does.
      - name: Verify the deployed build
        run: |
          set -eu
          want=$(sed -n 's/.*export const BUILD = "\([^"]*\)".*/\1/p' docs/config.js)
          echo "docs/config.js says: $want"
          if [ -z "$want" ]; then echo "::error::no BUILD found in docs/config.js"; exit 1; fi
          for i in $(seq 1 8); do
            got=$(curl -fsS --max-time 20 "$PAGES_URL/version.json?t=$RANDOM" 2>/dev/null \
                  | sed -n 's/.*"build": *"\([^"]*\)".*/\1/p' || true)
            echo "attempt $i: server says ${got:-<no answer>}"
            if [ "${got:-}" = "$want" ]; then
              echo "OK: $PAGES_URL is serving $want"
              curl -fsS --max-time 20 "$PAGES_URL/health" || true
              echo
              exit 0
            fi
            sleep 15
          done
          echo "::error::the deployed build never matched docs/config.js ($want). Check the Pages project still exists and the token still has Pages:Edit."
          exit 1
