name = "nil-audio"
main = "index.js"
compatibility_date = "2024-11-01"

# No bindings, no KV, no storage: this Worker only resolves a SoundCloud track id
# into a fresh signed CDN url and relays a 302. Nothing is stored or re-hosted.
#
# Deploy:
#   npm install -g wrangler     (or: npx wrangler)
#   wrangler login              (one time, opens a browser)
#   wrangler deploy             (from this directory)
#
# After deploy, wrangler prints a URL like
#   https://nil-audio.<your-subdomain>.workers.dev
# Put that base URL into docs/app.js as WORKER_BASE.

[observability]
enabled = true
