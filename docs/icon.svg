<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="News in Levels reader">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14918a"/>
      <stop offset="1" stop-color="#0b5c56"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- three text lines, wider as the level rises -->
  <g fill="#ffffff">
    <rect x="104" y="140" width="200" height="26" rx="13"/>
    <rect x="104" y="196" width="266" height="26" rx="13"/>
    <rect x="104" y="252" width="304" height="26" rx="13"/>
  </g>

  <!-- play triangle -->
  <path d="M196 322h112l-112 132z" fill="#ffffff"/>

  <!-- speaker waves -->
  <g fill="#9df0e8">
    <rect x="344" y="336" width="20" height="104" rx="10"/>
    <rect x="392" y="306" width="20" height="164" rx="10"/>
  </g>
</svg>
