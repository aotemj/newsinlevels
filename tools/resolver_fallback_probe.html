<!DOCTYPE html><html><head><meta charset="utf-8"><title>resolver fallback probe</title>
<style>html,body{margin:0}iframe{width:390px;height:844px;border:2px solid #f0f}</style>
</head><body>
<iframe id="app"></iframe>
<script>
/**
 * Does the resolver walk its delivery attempts correctly?
 *
 * Two independent things fail, and they need different fallbacks:
 *   * the base host is unreachable  -> move to the next BASE
 *   * the base answers but the bytes are unusable here -> flip the MODE first
 * (a mainland-China client gets a cached 403 from cf-media even though the signed
 * url is valid, which only /stream can route around).
 *
 * Runs entirely offline -- no resolver has to exist, nothing is fetched.
 */
const R = { steps: [], errors: [], finished: false };
const send = () => fetch('/report', { method: 'POST', body: JSON.stringify(R) });
const note = (k, v) => { R.steps.push([k, v]); send(); };
const wait = (ms) => new Promise(r => setTimeout(r, ms));

const frame = document.getElementById('app');
frame.src = './index.html';

(async function run() {
  let w, d;
  for (;;) {
    await wait(200);
    try { w = frame.contentWindow; d = frame.contentDocument; if (w && w.__nil) break; } catch (e) {}
  }
  w.addEventListener('error', e => R.errors.push('error: ' + (e.message || e)));
  w.addEventListener('unhandledrejection', e => R.errors.push('rejection: ' + (e.reason && e.reason.message || e.reason)));

  const N = w.__nil;
  const res = N.resolver;
  const checks = [];
  const check = (name, ok, detail) => {
    checks.push([name, ok]);
    note((ok ? 'PASS  ' : 'FAIL  ') + name, detail === undefined ? '' : detail);
  };
  const pathOf = (u) => (String(u).match(/\/(stream|audio)\//) || [null, '?'])[1];

  try {
    const all = res.state().all;
    note('configured_bases', all);

    if (all.length < 2) {
      note('SKIP', 'need 2+ bases in WORKER_BASES to exercise the walk');
    } else {
      const s0 = res.state();
      check('starts on base 1 in "stream" mode', res.base() === all[0] && s0.mode === 'stream',
            `${res.base()} / ${s0.mode}`);
      check('the url asks for the stream route', pathOf(res.url('123')) === 'stream',
            res.url('123'));

      // 1st failure: the bytes are unusable, so the SAME base is retried in the
      // other mode before any other host is blamed.
      const a1 = res.advance();
      check('1st failure keeps the base and flips the mode',
            a1 === true && res.base() === all[0] && res.state().mode === 'redirect',
            `${res.base()} / ${res.state().mode}`);
      check('the url now asks for the redirect route', pathOf(res.url('123')) === 'audio',
            res.url('123'));

      // 2nd failure: now move host, back to the preferred mode.
      const a2 = res.advance();
      check('2nd failure moves to the next base in "stream" mode',
            a2 === true && res.base() === all[1] && res.state().mode === 'stream',
            `${res.base()} / ${res.state().mode}`);

      // 3rd failure: last attempt, then it must refuse to loop.
      const a3 = res.advance();
      check('3rd failure flips the last base to the other mode',
            a3 === true && res.base() === all[1] && res.state().mode === 'redirect',
            `${res.base()} / ${res.state().mode}`);
      const a4 = res.advance();
      check('an exhausted walk returns false (no infinite retry)', a4 === false, `advance=${a4}`);
      check('and still returns a usable base to try (never "")', !!res.base(), res.base());
    }

    // An explicit override replaces the base list but must remain walkable, because
    // the mode is not what the user chose.
    N.settings.worker = 'https://example.invalid';
    check('explicit base is used verbatim', res.base() === 'https://example.invalid', res.base());
    check('explicit base still allows a mode flip',
          res.advance() === true && res.state().mode === 'redirect' && res.base() === 'https://example.invalid',
          `${res.base()} / ${res.state().mode}`);
    check('explicit base walk also terminates', res.advance() === false);
    N.settings.worker = '';

    // Deliberate no-resolver mode: disable the feature and say so, rather than
    // blaming a Worker that is actually installed.
    N.settings.worker = '__off__';
    check('worker=off reports no resolver', res.hasCors() === false);
    check('worker=off explains itself', !!N.player.timingsReason(), String(N.player.timingsReason()));
    N.settings.worker = '';

    const why = N.player.timingsReason();
    if (N.player.times) {
      check('a ready player reports no reason', why === null, String(why));
    } else {
      check('an unready player gives an actionable reason', !!why, String(why));
      check('that reason does not blame a missing Worker',
            !/install the worker/i.test(String(why)), String(why));
    }

    note('final_resolver_state', res.state());
    const failed = checks.filter(c => !c[1]);
    note('summary', `${checks.length - failed.length}/${checks.length} checks passed`);
    if (failed.length) R.errors.push('failed checks: ' + failed.map(f => f[0]).join('; '));
  } catch (e) {
    R.errors.push('probe threw: ' + (e && e.message || e));
  }

  R.finished = true;
  send();
})();
</script>
</body></html>
