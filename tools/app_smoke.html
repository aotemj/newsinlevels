<!DOCTYPE html><html><head><meta charset="utf-8"><title>app smoke</title>
<style>html,body{margin:0}iframe{width:390px;height:800px;border:1px solid #ccc}</style>
</head><body>
<iframe id="app"></iframe>
<script>
/**
 * Drives docs/index.html inside a same-origin iframe and reports what the real
 * app does: rendering, filtering, navigation, reading view and the player.
 * Nothing here is mocked -- if a step fails the report says so.
 *
 * Pass --query "worker=off" to exercise the degraded path (no resolver), or a
 * real worker URL to exercise the full path.
 */
const R = { steps: [], errors: [], finished: false };
const send = () => fetch('/report', { method: 'POST', body: JSON.stringify(R) });
const note = (k, v) => { R.steps.push([k, v]); send(); };
const wait = (ms) => new Promise(r => setTimeout(r, ms));

async function until(fn, ms = 12000, every = 150) {
  const t0 = Date.now();
  for (;;) {
    try { const v = fn(); if (v) return v; } catch (e) {}
    if (Date.now() - t0 > ms) throw new Error('timeout waiting');
    await wait(every);
  }
}

const frame = document.getElementById('app');
// forward ?worker=… (and any other flag) to the app inside the iframe, so the
// harness and the app agree on which mode is under test
const forwarded = new URLSearchParams(location.search).get('worker');
frame.src = './index.html' + (forwarded ? '?worker=' + encodeURIComponent(forwarded) : '');

let started = false;
(async function run() {
  // an iframe fires `load` for its initial about:blank document too, so wait for
  // the app itself rather than for the first load event
  let w, d;
  for (;;) {
    await wait(200);
    try {
      w = frame.contentWindow;
      d = frame.contentDocument;
      if (w && w.__nil) break;
    } catch (e) {}
  }
  if (started) return;
  started = true;
  w.addEventListener('error', (e) => R.errors.push('error: ' + (e.message || e)));
  w.addEventListener('unhandledrejection', (e) => R.errors.push('rejection: ' + (e.reason && e.reason.message || e.reason)));

  try {
    // ---------- list view
    const cards = await until(() => d.querySelectorAll('#cards .card').length >= 10 ? d.querySelectorAll('#cards .card') : null);
    note('list.cards_rendered', cards.length);
    note('list.first_title', cards[0].querySelector('.t').textContent.trim());
    note('list.first_href', cards[0].getAttribute('href'));
    note('list.has_thumb', !!cards[0].querySelector('img.thumb'));
    note('list.level_chips', d.querySelectorAll('#lvchips .chip').length);
    note('list.category_chips', d.querySelectorAll('#catchips .chip').length);

    // the level chip chooses which level a story opens at (it is not a list
    // filter: every story in the window has all three levels)
    d.querySelectorAll('#lvchips .chip')[2].click();           // "Level 2"
    await wait(500);
    note('lvchip.readLevel_saved', JSON.parse(w.localStorage.getItem('nil.settings') || '{}').readLevel);

    // search
    const q = d.querySelector('#q');
    q.value = 'butter';
    q.dispatchEvent(new w.Event('input', { bubbles: true }));
    await wait(600);
    note('search.butter_cards', d.querySelectorAll('#cards .card').length);
    q.value = '';
    q.dispatchEvent(new w.Event('input', { bubbles: true }));
    await wait(500);

    // ---------- reader view
    const id = cards[0].getAttribute('href').replace('#/s/', '');
    w.location.hash = '#/s/' + id;
    await until(() => d.querySelector('#reader-body .article'));
    note('reader.story_id', id);
    note('reader.level_tabs', d.querySelectorAll('.seg-tabs button').length);
    note('reader.paragraphs', d.querySelectorAll('#reader-body .article p').length);
    const sents = d.querySelectorAll('#reader-body .article .s');
    note('reader.sentence_spans', sents.length);
    note('reader.first_sentence', sents[0] ? sents[0].textContent.trim().slice(0, 70) : null);
    note('reader.bold_words', d.querySelectorAll('#reader-body .article strong.w').length);
    note('reader.word_list', d.querySelectorAll('#reader-body .words dt').length);
    note('reader.image', !!d.querySelector('.hero'));

    // switching level keeps the reader intact
    const tabs = d.querySelectorAll('.seg-tabs button');
    if (tabs.length > 1) {
      const l2 = tabs[1];
      l2.click();
      await wait(900);
      note('reader.after_level_switch', {
        level: d.querySelector('.seg-tabs button[aria-pressed="true"]').textContent,
        paragraphs: d.querySelectorAll('#reader-body .article p').length,
        words: d.querySelectorAll('#reader-body .words dt').length,
      });
    }

    // compare mode
    const cmp = d.querySelector('[data-a="compare"]');
    if (cmp) {
      cmp.click();
      await wait(400);
      note('reader.compare_columns', d.querySelectorAll('#reader-body .cols .col').length);
      cmp.click();
      await wait(300);
    }

    // ---------- player
    const pl = d.querySelector('#player');
    note('player.visible', pl && !pl.hidden);

    // The controls must START folded away -- expanded by default they sat on the
    // last lines of every article, which is what prompted the change.
    note('player.collapsed_by_default', !!pl.querySelector('[data-a="bar"]'));
    note('player.collapsed_hides_full_panel',
      !pl.querySelector('[data-a="scrub"]') && !pl.querySelector('.rate-btn'));
    note('player.collapsed_height', Math.round(pl.getBoundingClientRect().height));

    // The reserved space must equal the COLLAPSED bar: more and the article is
    // padded for a panel that is not showing, less and text hides behind it.
    const barH = d.querySelector('.bottombar').getBoundingClientRect().height;
    const padB = parseFloat(w.getComputedStyle(d.body).paddingBottom) || 0;
    note('player.reserved_space', { paddingBottom: Math.round(padB), bottombar: Math.round(barH) });
    note('player.reserved_space_matches_collapsed_bar', Math.abs(padB - barH) <= 1);

    // Expanding is a tap, and it OVERLAYS: the article must not reflow.
    const scrollBefore = d.body.scrollHeight;
    pl.querySelector('[data-a="togglecollapse"]').click();
    await wait(300);
    note('player.expands_on_tap', !!pl.querySelector('[data-a="scrub"]'));
    note('player.expand_does_not_reflow_article', d.body.scrollHeight === scrollBefore,
      `${scrollBefore} -> ${d.body.scrollHeight}`);

    note('player.has_controls', !!pl.querySelector('[data-a="toggle"]'));
    note('player.has_scrub', !!pl.querySelector('[data-a="scrub"]'));
    note('player.has_rate', !!pl.querySelector('[data-a="rate"]'));
    note('player.loop_buttons', ['clip', 'segloop', 'shadow', 'ab', 'seg', 'save']
      .filter(a => pl.querySelector(`[data-a="${a}"]`)));
    const audio = d.querySelector('#audio');
    note('player.audio_src', (audio.getAttribute('src') || '').slice(0, 90));

    // does the clip actually load and advance? (the podcast feed 302s to the CDN)
    const meta = await new Promise((res) => {
      if (audio.readyState >= 1) return res({ readyState: audio.readyState, duration: audio.duration });
      const t = setTimeout(() => res({ timeout: true, readyState: audio.readyState,
        error: audio.error && audio.error.code }), 30000);
      audio.addEventListener('loadedmetadata', () => {
        clearTimeout(t); res({ readyState: audio.readyState, duration: +audio.duration.toFixed(2) });
      }, { once: true });
      audio.addEventListener('error', () => {
        clearTimeout(t); res({ error: audio.error && audio.error.code, readyState: audio.readyState });
      }, { once: true });
      audio.load();
    });
    note('player.audio_loaded', meta);
    note('player.audio_duration_matches_index', meta.duration ? Math.round(meta.duration) : null);

    if (meta.duration) {
      const adv = await new Promise((res) => {
        audio.currentTime = 1;
        audio.play().then(() => {
          const t0 = audio.currentTime;
          setTimeout(() => res({ from: +t0.toFixed(2), to: +audio.currentTime.toFixed(2), paused: audio.paused }), 2500);
        }).catch((e) => res({ play_rejected: String(e.message || e) }));
      });
      note('player.audio_advances', adv);
      audio.pause();
    }

    // The probe wipes the Chrome profile, so this is a genuinely fresh install:
    // the stored default must be a preset the button can cycle (it used to be 0.9,
    // which the old slider could reach but the cycler cannot).
    note('player.rate_default_is_1', audio.playbackRate === 1, audio.playbackRate);

    // Rate is a preset cycler now: one tap moves to the next preset and wraps.
    // Asserted relative to wherever it started, because the stored value comes from
    // localStorage and the old build could have saved anything on the 0.05 grid.
    const RATES = [0.75, 1, 1.25, 1.5, 2];
    const startIdx = RATES.indexOf(audio.playbackRate);
    note('player.rate_starts_on_a_preset', startIdx >= 0, audio.playbackRate);
    const seen = [];
    for (let i = 0; i < RATES.length; i++) {
      pl.querySelector('[data-a="rate"]').click();
      await wait(120);
      seen.push(audio.playbackRate);
    }
    const want = RATES.map((_, i) => RATES[(startIdx + 1 + i) % RATES.length]);
    note('player.rate_cycle', seen);
    note('player.rate_cycle_is_the_presets', JSON.stringify(seen) === JSON.stringify(want),
      `${seen.join(" -> ")} (wanted ${want.join(" -> ")})`);
    note('player.rate_label', pl.querySelector('[data-a="rate"]').textContent.trim());

    // A-B marker
    pl.querySelector('[data-a="ab"]').click();
    await wait(200);
    note('player.ab_marker', !!pl.querySelector('[data-m="a"]'));
    pl.querySelector('[data-a="abclear"]')?.click();

    // whole-clip loop toggle (re-query: the player repaints its own DOM)
    pl.querySelector('[data-a="clip"]').click();
    await wait(200);
    note('player.clip_loop_on', pl.querySelector('[data-a="clip"]').getAttribute('aria-pressed'));
    pl.querySelector('[data-a="clip"]').click();
    await wait(200);
    note('player.clip_loop_off', pl.querySelector('[data-a="clip"]').getAttribute('aria-pressed'));

    // sentence controls must be disabled without a Worker, and say why
    note('player.sentence_btn_disabled_without_worker',
      pl.querySelector('[data-a="segloop"]').disabled);
    note('player.setup_hint', (pl.querySelector('.pnote') || {}).textContent?.trim().slice(0, 90));

    // ---------- offline audio cache (automatic now, so its limits matter)
    const N = w.__nil;
    const ac = N.audioCache;
    const mk = (n) => new Blob([new Uint8Array(n)], { type: 'audio/mpeg' });
    note('audio.cache_default_on', N.settings.cacheAudio === true);
    await ac.clear(); ac.clearDismissed();

    await ac.put('ev-old', mk(1000));
    await ac.put('ev-keep', mk(1000), { pinned: true });
    await ac.put('ev-new', mk(1000));
    const cap = await ac.enforceCap(2500);          // room for two of the three
    note('audio.evicts_lru_unpinned',
      (await ac.has('ev-old')) === false && (await ac.has('ev-new')) === true);
    note('audio.evicts_skips_pinned', await ac.has('ev-keep'));
    note('audio.enforceCap_report', cap);
    // NB: compare against the CHILD window's Blob. Each frame has its own realm and
    // `instanceof` across two realms is always false, which made this look like a bug
    // in the store when it was a bug in the test.
    note('audio.get_returns_blob', (await ac.get('ev-keep')) instanceof w.Blob);

    // An explicit removal must survive: auto-caching putting it straight back would
    // make the button look broken.
    await ac.dismiss('ev-new');
    note('audio.dismiss_removes', (await ac.has('ev-new')) === false);
    note('audio.dismiss_is_remembered', ac.isDismissed('ev-new') === true);
    note('audio.auto_cache_respects_dismissal',
      (await N.player._autoCache('ev-new', mk(10))) === false);

    // ...and the automatic path does store a fresh clip
    note('audio.auto_cache_stores', (await N.player._autoCache('ev-fresh', mk(1234))) === true);
    note('audio.auto_cache_size', (await ac.meta('ev-fresh')).blob && (await ac.meta('ev-fresh')).blob.size);
    note('audio.stats', await ac.stats());

    ac.clearDismissed();
    const cleared = await ac.clear();
    note('audio.clear_empties_the_store', cleared >= 1 && (await ac.stats()).count === 0);

    // ---------- word sheet
    const bold = d.querySelector('#reader-body .article strong.w');
    if (bold) {
      bold.click();
      await until(() => d.querySelector('.sheet'));
      note('sheet.word', d.querySelector('.sheet h3').textContent);
      note('sheet.actions', [...d.querySelectorAll('.sheet .row button, .sheet .row a')].map(b => b.textContent.trim()));
      d.querySelector('.sheet #close').click();
      await wait(200);
      note('sheet.closed', !d.querySelector('.sheet'));
    }

    // ---------- vocab + saved tabs
    w.location.hash = '#/vocab';
    await until(() => d.querySelector('#view .pad'));
    note('vocab.view_ok', d.querySelector('#view .pad').textContent.includes('word'));
    w.location.hash = '#/saved';
    await wait(700);
    note('saved.view_ok', (d.querySelector('#view .pad') || {}).textContent?.includes('Saved stories'));
    w.location.hash = '#/';
    await wait(500);
    note('back_to_list_cards', d.querySelectorAll('#cards .card').length);

    // ---------- manifest + service worker
    note('manifest.link', !!d.querySelector('link[rel="manifest"]'));
    note('sw.registered', !!(w.navigator.serviceWorker && w.navigator.serviceWorker.controller !== undefined));
  } catch (e) {
    R.fatal = String(e && e.stack || e);
  }
  R.errors = [...new Set(R.errors)].slice(0, 20);
  R.finished = true;
  send();
})();
setTimeout(() => { R.finished = true; R.timeout = true; send(); }, 90000);
</script></body></html>
