<!DOCTYPE html><html><head><meta charset="utf-8"><title>worker-path smoke</title>
<style>html,body{margin:0}iframe{width:390px;height:800px;border:1px solid #ccc}</style>
</head><body>
<iframe id="app"></iframe>
<script>
/**
 * The end-to-end test that matters: with a resolver configured, does the app
 * fetch the clip, decode it, derive sentence timings, and wire them to
 * tap-to-seek / single-sentence looping?
 *
 * Set WORKER via ?worker=... (defaults to the local Node wrapper on :8787).
 */
const R = { steps: [], errors: [], finished: false };
const send = () => fetch('/report', { method: 'POST', body: JSON.stringify(R) });
const note = (k, v) => { R.steps.push([k, v]); send(); };
const wait = (ms) => new Promise(r => setTimeout(r, ms));

const params = new URLSearchParams(location.search);
const WORKER = params.get('worker') || 'http://127.0.0.1:8787';
// To run this against a real deployment instead of the local wrapper, point the
// harness at it:  browser_probe.py ... --query "worker=https://<your>.workers.dev"

const frame = document.getElementById('app');
frame.src = './index.html?worker=' + encodeURIComponent(WORKER);

async function until(fn, ms = 45000, every = 200) {
  const t0 = Date.now();
  for (;;) {
    try { const v = fn(); if (v) return v; } catch (e) {}
    if (Date.now() - t0 > ms) throw new Error('timeout waiting');
    await wait(every);
  }
}

let started = false;
(async function run() {
  // an iframe fires `load` for its initial about:blank document too, so wait for
  // the app itself rather than for the first load event
  let w2, d2;
  const giveUp = Date.now() + 60000;
  for (;;) {
    await wait(200);
    try {
      w2 = frame.contentWindow;
      d2 = frame.contentDocument;
      if (w2 && w2.__nil) break;
    } catch (e) {}
    if (Date.now() > giveUp) {
      R.boot_failed = {
        href: (() => { try { return frame.contentWindow.location.href; } catch (e) { return 'cross-origin?'; } })(),
        has_window: !!frame.contentWindow,
        has_doc: !!frame.contentDocument,
        errs: (() => { try { return frame.contentWindow.__errs; } catch (e) { return String(e); } })(),
        view_html: (() => { try { return (frame.contentDocument.querySelector('#view') || {}).innerHTML?.slice(0, 400); } catch (e) { return String(e); } })(),
        body_text: (() => { try { return (frame.contentDocument.body.textContent || '').trim().slice(0, 200); } catch (e) { return String(e); } })(),
      };
      R.finished = true;
      send();
      return;
    }
  }
  if (started) return;
  started = true;
  w2.addEventListener('error', e => R.errors.push('error: ' + (e.message || e)));
  w2.addEventListener('unhandledrejection', e => R.errors.push('rejection: ' + (e.reason && e.reason.message || e.reason)));

  try {
    note('worker.base', WORKER);
    note('boot.url', w2.location.href);
    note('boot.worker_in_app', w2.__nil.settings.worker);
    note('boot.view_chars', (d2.querySelector('#view') || {}).innerHTML?.length ?? null);
    note('boot.view_text', ((d2.querySelector('#view') || {}).textContent || '').trim().slice(0, 120));

    const cards = await until(() => d2.querySelectorAll('#cards .card').length >= 5 ? d2.querySelectorAll('#cards .card') : null);
    note('list.cards', cards.length);

    // worker health through the app's own fetch (CORS check)
    const h = await w2.fetch(WORKER + '/health');
    const hj = await h.json();
    note('worker.health_ok', hj.ok);
    note('worker.cors_readable', h.status === 200);

    // open a story
    const id = 'paris-butter-shop';
    w2.location.hash = '#/s/' + id;
    await until(() => d2.querySelector('#reader-body .article .s'));
    const spans = d2.querySelectorAll('#reader-body .article .s');
    note('reader.sentences', spans.length);
    note('reader.sentences_no_worker_gating', !d2.querySelector('#player .pnote')?.textContent.includes('Install the Worker'));

    const pl = d2.querySelector('#player');
    note('player.sentence_buttons_enabled', !pl.querySelector('[data-a="segloop"]').disabled);

    // wait for auto-segmentation to finish and report what it produced
    const status = await until(() => {
      const t = pl.querySelector('.pnote');
      return t && /Sentence timings:/.test(t.textContent) ? t.textContent.trim() : null;
    }, 90000);
    note('player.segmentation_status', status);
    note('player.sentence_buttons_enabled_after_seg',
      !d2.querySelector('#player [data-a="segloop"]').disabled);
    note('player.shadow_btn_enabled_after_seg',
      !d2.querySelector('#player [data-a="shadow"]').disabled);

    // sentence marks drawn on the scrub bar
    const audio = d2.querySelector('#audio');
    note('audio.duration', audio.duration ? +audio.duration.toFixed(2) : null);
    // give durationchange a moment; marks depend on a settled duration
    for (let i = 0; i < 15 && !d2.querySelectorAll('.marks i').length; i++) await wait(200);
    note('scrub.marks', d2.querySelectorAll('.marks i').length);
    note('scrub.marks_match_sentences',
      d2.querySelectorAll('.marks i').length === d2.querySelectorAll('#reader-body .article .s').length);
    note('scrub.mark_left_percent',
      [...d2.querySelectorAll('.marks i')].slice(0, 3).map(n => n.style.left));
    note('duration_sources', {
      media: w2.__nil.player.audio.duration || null,
      from_index: w2.__nil.player.knownDur || null,
      used_for_marks: w2.__nil.player._effectiveDuration(),
    });
    const P = w2.__nil.player;
    note('player.times_first3', (P.times || []).slice(0, 3).map(t => t.map(x => +x.toFixed(2))));
    note('player.times_last', (P.times || []).slice(-1).map(t => t.map(x => +x.toFixed(2))));
    note('player.active_before_tap', P.active);

    // click a sentence -> audio should jump there and start looping that sentence
    const target = spans[Math.min(2, spans.length - 1)];
    const wanted = P.times[2];
    target.click();
    await wait(600);
    note('tap_sentence.wanted_start', wanted ? +wanted[0].toFixed(2) : null);
    note('tap_sentence.state_after_600ms', {
      currentTime: +audio.currentTime.toFixed(2), paused: audio.paused,
      active: P.active, loopSentence: P.loopSentence, hasTimes: !!P.times,
    });
    await wait(2200);
    note('tap_sentence.currentTime', +(audio.currentTime || 0).toFixed(2));
    note('tap_sentence.highlighted',
      [...d2.querySelectorAll('.article .s.on')].map(s => s.dataset.i));
    note('tap_sentence.toast', d2.querySelector('#toast').textContent);

    // let the sentence loop run past its end: it must wrap back, not stop
    const before = audio.currentTime;
    const looped = await new Promise(async (res) => {
      const t0 = Date.now();
      const iv = setInterval(() => {
        if (audio.currentTime < before - 0.5) {
          clearInterval(iv); res({ wrapped: true, from: +before.toFixed(2),
            backTo: +audio.currentTime.toFixed(2), ms: Date.now() - t0 });
        }
        if (Date.now() - t0 > 15000) { clearInterval(iv); res({ wrapped: false, at: +audio.currentTime.toFixed(2) }); }
      }, 120);
    });
    note('sentence_loop.realtime_wrap', looped);

    // Real-time playback is flaky under headless Chrome (the audio clock can
    // stall with no output device), so assert the same wrap deterministically:
    // park the playhead just before the pinned sentence ends and fire timeupdate.
    const pinned = P.loopIndex;
    const span = P.times[pinned];
    audio.currentTime = Math.max(0, span[1] - 0.02);
    audio.dispatchEvent(new w2.Event('timeupdate'));
    await wait(250);
    note('sentence_loop.deterministic', {
      pinned,
      sentence_end: +span[1].toFixed(2),
      after_tick: +audio.currentTime.toFixed(2),
      wrapped_to_pinned_start: Math.abs(audio.currentTime - Math.max(0, span[0] - 0.06)) < 0.25,
    });

    // ...and it must NOT have jumped anywhere else in the clip
    note('sentence_loop.stayed_local', audio.currentTime > span[0] - 0.3 && audio.currentTime < span[1]);

    // shadowing mode arms itself and pauses at the sentence end
    pl.querySelector('[data-a="shadow"]').click();
    await wait(600);
    note('shadow.armed', d2.querySelector('[data-a="shadow"]').getAttribute('aria-pressed'));
    audio.pause();
  } catch (e) {
    R.fatal = String(e && e.stack || e);
  }
  R.errors = [...new Set(R.errors)].slice(0, 20);
  R.finished = true;
  send();
})();
setTimeout(() => { R.finished = true; R.timeout = true; send(); }, 200000);
</script></body></html>
